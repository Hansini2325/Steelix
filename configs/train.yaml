# ============================================================
# configs/train.yaml
# YOLOv8 Training Configuration
# ============================================================

# ── Model ────────────────────────────────────────────────────
model: yolov8n.pt          # Options: yolov8n.pt | yolov8s.pt | yolov8m.pt
task: detect               # detect | classify  (auto-set by prepare_dataset.py)

# ── Core Hyperparameters ─────────────────────────────────────
epochs: 100
imgsz: 640
batch: 16
patience: 20               # Early stopping patience (epochs)
seed: 42

# ── Optimizer ────────────────────────────────────────────────
optimizer: AdamW           # SGD | Adam | AdamW | auto
lr0: 0.001                 # Initial learning rate
lrf: 0.01                  # Final lr = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# ── Device ───────────────────────────────────────────────────
device: ""                 # "" = auto-detect (CUDA if available, else CPU)
workers: 4

# ── Augmentation ─────────────────────────────────────────────
# Industrial steel surface augmentation — tuned to preserve defect semantics
augmentation: true
hsv_h: 0.015               # Hue shift (subtle — steel is grey/silver)
hsv_s: 0.2                 # Saturation variation
hsv_v: 0.3                 # Brightness/contrast variation
degrees: 5.0               # Small rotation (defects are orientation-dependent)
translate: 0.1             # Translation fraction
scale: 0.4                 # Scale jitter
shear: 0.0                 # Avoid shear — distorts defect geometry
perspective: 0.0           # No perspective warp on flat steel sheets
flipud: 0.3                # Vertical flip (steel can be inspected either way)
fliplr: 0.5                # Horizontal flip (symmetric)
mosaic: 1.0                # Mosaic augmentation (helps small defects)
mixup: 0.0                 # Mixup disabled (creates ambiguous defect labels)
copy_paste: 0.0            # No copy-paste (fabricates bounding boxes)

# ── Output ───────────────────────────────────────────────────
project: results/training
name: neu_det_experiment
exist_ok: true             # Allow overwriting (use unique `name` for ablations)
save_period: -1            # Save checkpoint every N epochs (-1 = only best/last)
plots: true                # Save training plots
verbose: true

# ── Validation ───────────────────────────────────────────────
val: true
conf: 0.25                 # Confidence threshold during validation
iou: 0.45                  # NMS IoU threshold

# ── Hardware tuning ──────────────────────────────────────────
amp: true                  # Mixed precision (AMP) — speeds up CUDA training
cache: false               # Set to "ram" or "disk" if you have sufficient memory
rect: false                # Rectangular training (set true for speed tests)
